# EC ログ分類のタスク定義（暫定）。
# 比較の公平性のため、データセット・ラベルはモデル別 config ではなくここで一元管理する。
# モデルに渡すテキスト（instructions / description / prompt.md）は英語で統一する。

# 評価データ（リポジトリルートからの相対パス）。実行時は --dataset で上書き可。
dataset = "data/samples/ec_logs_sample.jsonl"
# 全モデル共通の指示文。LLM は prompt.md の {instructions}、Jev / Laya は choice 質問の instructions に入る
instructions = "Classify this e-commerce system log line into exactly one of the following categories."

[[labels]]
name = "payment"
description = "Payment, billing, or card authorization failures and anomalies"

[[labels]]
name = "auth"
description = "Login, session, or token issues"

[[labels]]
name = "inventory"
description = "Stock reservation, out-of-stock, or SKU sync issues"

[[labels]]
name = "shipping"
description = "Shipping, fulfillment, or carrier integration issues"

[[labels]]
name = "performance"
description = "Latency degradation, timeouts, or resource exhaustion"

[[labels]]
name = "security"
description = "Unauthorized access, attacks, or suspected bots"

[[labels]]
name = "normal"
description = "Normal informational logs (no action needed)"
