# jevbench の AG News（ニュースの話題、4 ラベル）を、旧ラベル説明で再現するタスク定義。
# 出典: https://github.com/dhruvmehra/jevbench（MIT License, Copyright (c) 2026 Dhruv Mehra）
#   ラベル名・説明: src/jevbench/datasets.py の 55e9102 より前の版（caa8f8c）から同じ順序でそのまま写した。変更しない
#     55e9102「AG News label descriptions aligned with dataset convention」で説明が書き換えられた（新版は jevbench_agnews_v2）。
#     公表表の「jev (new descriptions)」以外の行（jev 84.3・laya・LLM・BERT）はこの旧版で測られたと推定している
#     （コミット時刻と表の行名からの推定で、明記はない）
#   instructions: src/jevbench/classifiers/jev.py の build_questions（jevbench が Jev / Laya に渡す指示文）
# 評価データは `uv run hellow-jev-prepare jevbench` で作る。
# jevbench の公表値は同じディレクトリの reference.toml、経緯と注意点は tasks/JEVBENCH.md。

# 評価データ（リポジトリルートからの相対パス）
dataset = "data/processed/jevbench_agnews.jsonl"
# 全モデル共通の指示文。LLM は prompt.md の {instructions}、Jev / Laya は choice 質問の instructions に入る
instructions = "Which category best describes the text? Pick exactly one."
# jevbench は Jev / Laya の state にテキストそのもの（文字列）を渡すので揃える
# （既定の "object" では {"log": テキスト} になり、モデルへの入力が jevbench と変わる）
state_format = "string"

[[labels]]
name = "world"
description = "World news: politics, governments, international affairs, conflicts."

[[labels]]
name = "sports"
description = "Sports news: games, athletes, teams, matches, results."

[[labels]]
name = "business"
description = "Business news: companies, markets, economy, finance, deals."

[[labels]]
name = "sci_tech"
description = "Science and technology news: research, software, hardware, internet."
