# jevbench の AG News（ニュースの話題、4 ラベル）を、新ラベル説明で再現するタスク定義。
# 出典: https://github.com/dhruvmehra/jevbench（MIT License, Copyright (c) 2026 Dhruv Mehra）。全文: tasks/LICENSE-jevbench
#   ラベル名・説明: src/jevbench/datasets.py の 55e9102 以降の版（c983cc4 と同じ）から同じ順序でそのまま写した。変更しない
#     公表表の「jev (new descriptions)」行（Acc 85.8）の再現用。旧版の説明は jevbench_agnews
#   instructions: src/jevbench/classifiers/jev.py の build_questions（jevbench が Jev / Laya に渡す指示文）
# 評価データは `uv run hellow-jev-prepare jevbench` で作る。
# jevbench の公表値は同じディレクトリの reference.toml、経緯と注意点は tasks/JEVBENCH.md。

# 評価データ（リポジトリルートからの相対パス）
dataset = "data/processed/jevbench_agnews.jsonl"
# Jev / Laya の choice 質問の instructions に入る。LLM には渡さない（jevbench の LLM プロンプトに無いため。prompt.md）
instructions = "Which category best describes the text? Pick exactly one."
# jevbench は Jev / Laya の state にテキストそのもの（文字列）を渡すので揃える
# （既定の "object" では {"log": テキスト} になり、モデルへの入力が jevbench と変わる）
state_format = "string"

[[labels]]
name = "world"
description = "World news: international affairs, politics, governments, elections, wars, conflicts, disasters and crime. Not business, sports or technology."

[[labels]]
name = "sports"
description = "Sports news: games, matches, athletes, teams, leagues, scores, transfers and results."

[[labels]]
name = "business"
description = "Business news: stock markets, earnings, economy, oil and commodities, trade, mergers, airlines, retail and companies outside the technology sector."

[[labels]]
name = "sci_tech"
description = "Science and technology news: technology companies and their products, earnings or lawsuits (e.g. Microsoft, Google, Apple, IBM, Intel), software, hardware, internet, telecom, video games, space, and scientific or medical research."
