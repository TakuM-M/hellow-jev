name = "llm_api"
task = "log_classification"
# 接続確立などの初回コストを除くため、計測前に空打ちする件数
warmup = 2

[classifier]
type = "llm"
backend = "api"
api_format = "anthropic"   # Anthropic Messages API。OpenAI 互換 API なら "openai" + base_url
# 再現性のため日付付きのモデル ID で固定する
model = "claude-haiku-4-5-20251001"
temperature = 0.0
max_tokens = 16            # ラベル名 1 語だけ返させる
# base_url = "https://api.anthropic.com"   # 未指定なら環境変数 LLM_API_BASE_URL → この既定値
# API キーは環境変数 LLM_API_KEY（無ければ ANTHROPIC_API_KEY）。config には書かない

# 比較表のコスト列用（USD / 1M tokens）。公式料金ページで確認してから使う
[pricing]
input_per_mtok = 1.0
output_per_mtok = 5.0
