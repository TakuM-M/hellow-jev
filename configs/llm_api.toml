name = "llm_api"
task = "log_classification"
# 接続確立などの初回コストを除くため、計測前に空打ちする件数
warmup = 2
# 比較表の「実行環境」列。API はリクエスト先を書く
hardware = "API (Anthropic)"

[classifier]
type = "llm"
backend = "api"
api_format = "anthropic"   # Anthropic Messages API。OpenAI 互換 API なら "openai" + base_url
# 再現性のため日付付きのモデル ID で固定する
model = "claude-haiku-4-5-20251001"
temperature = 0.0
max_tokens = 32            # 出力は {"label": <ラベル名>} の JSON。Banking77 の長いラベル名（例: balance_not_updated_after_cheque_or_cash_deposit）でも途中で切れない長さ
# base_url = "https://api.anthropic.com"   # 未指定なら環境変数 LLM_API_BASE_URL → この既定値
# API キーは環境変数 LLM_API_KEY（無ければ ANTHROPIC_API_KEY）。config には書かない

# 比較表のコスト列用（USD / 1M tokens）。report は集計時にこの値を読む
# 2026-09-29 に公式料金ページで確認（https://platform.claude.com/docs/en/about-claude/pricing）:
# Claude Haiku 4.5 は base input $1 / MTok、output $5 / MTok（Claude API 直、キャッシュ・Batch なし）
[pricing]
input_per_mtok = 1.0
output_per_mtok = 5.0
