name = "laya"
task = "log_classification"
# モデルロード・初回推論のコストを除くため、計測前に空打ちする件数
warmup = 2
# 比較表の「実行環境」列。レイテンシは推論マシン依存なので必ず書く
# hardware = "CPU (8 cores)"

[classifier]
type = "laya"
backend = "http"   # laya-serve（Jev 互換 HTTP）経由
# endpoint = "http://localhost:8000"   # 未指定なら環境変数 LAYA_ENDPOINT → この既定値
# ログ・ラベル説明とも英語なので英語版を使う。multilingual / typed-decisions も指定可。
# laya-serve は未知の名前を黙って自動選択に切り替えるので、この 3 つ以外はクライアント側でエラーにする。
# サーバは LAYA_MODELS=english で起動すると、このチェックポイントだけを先読みする
model = "english"
