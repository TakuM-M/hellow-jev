name = "laya"
task = "log_classification"
# モデルロード・初回推論のコストを除くため、計測前に空打ちする件数
warmup = 2
# 比較表の「実行環境」列。レイテンシは推論マシン依存なので必ず書く
# hardware = "CPU (8 cores)"

[classifier]
type = "laya"
backend = "http"   # laya-serve（Jev 互換 HTTP）経由
# endpoint = "http://localhost:8000"   # 未指定なら環境変数 LAYA_ENDPOINT → この既定値
# ラベル説明（criteria）が日本語なので多言語版を使う。english / typed-decisions も指定可
model = "multilingual"
