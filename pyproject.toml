[project]
name = "hellow-jev"
version = "0.1.0"
description = "Jev / Laya / LLM のログ分類タスク比較調査"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hellow_jev"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
